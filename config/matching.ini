# Shared settings for GUI and enroll/verify/compare. No rebuild is required.
# GUI: restart or click Reload Settings. Thresholds are displayed read-only.
# CLI: --config PATH selects another file; --threshold VALUE overrides appearance.
# All four keys are required. Decimal points use '.', irrespective of system locale.
appearance_threshold = 0.8
minimum_inliers = 10
minimum_inlier_ratio = 0.70
# RANSAC tolerance as a fraction of the query foreground bounding-box diagonal.
ransac_reprojection_ratio = 0.025
